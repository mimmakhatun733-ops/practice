
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>আমার টু-ডু লিস্ট</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, "Noto Sans Bengali", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    transition: 0.3s;
}

.app {
    width: 100%;
    max-width: 520px;
    background: white;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 15px 35px #00000025;
    color: #222;
}

h1 {
    text-align: center;
    margin-bottom: 25px;
    font-size: 28px;
}

.add-box {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
}

input, select, button {
    font: inherit;
}

#taskInput {
    flex: 1;
    min-width: 0;
    padding: 12px;
    border: 2px solid #ddd;
    border-radius: 9px;
    outline: none;
}

#taskInput:focus, #searchInput:focus {
    border-color: #667eea;
}

button {
    border: none;
    border-radius: 8px;
    padding: 10px 14px;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    opacity: 0.85;
    transform: translateY(-1px);
}

.add-btn {
    background: #667eea;
    color: white;
    font-weight: bold;
}

.tools {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
}

#searchInput, #filterSelect {
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: white;
    color: #222;
}

.stats {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    font-size: 14px;
    margin-bottom: 10px;
    flex-wrap: wrap;
}

.progress-bg {
    height: 9px;
    background: #e8e8ee;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 22px;
}

#progressBar {
    width: 0;
    height: 100%;
    background: linear-gradient(90deg, #667eea, #764ba2);
    transition: width 0.3s;
}

#taskList {
    list-style: none;
}

.task {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 13px 10px;
    margin-bottom: 10px;
    background: #f7f8fa;
    border-left: 4px solid #667eea;
    border-radius: 9px;
}

.task input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: #667eea;
    cursor: pointer;
}

.task-text {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
}

.task.done .task-text {
    text-decoration: line-through;
    color: #999;
}

.actions {
    display: flex;
    gap: 5px;
}

.edit-btn {
    background: #ffc107;
    color: #222;
    padding: 7px 9px;
}

.delete-btn {
    background: #ff5757;
    color: white;
    padding: 7px 9px;
}

.empty {
    text-align: center;
    color: #888;
    padding: 18px 0;
}

.bottom {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-top: 18px;
}

.clear-btn {
    background: #ff5757;
    color: white;
}

.theme-btn {
    background: #333;
    color: white;
}

body.dark {
    background: linear-gradient(135deg, #17172d, #34234c);
}

body.dark .app {
    background: #222235;
    color: #f5f5f5;
}

body.dark .task {
    background: #303047;
}

body.dark #taskInput,
body.dark #searchInput,
body.dark #filterSelect {
    background: #303047;
    color: white;
    border-color: #50506a;
}

body.dark .progress-bg {
    background: #45455a;
}

body.dark .task.done .task-text {
    color: #aaa;
}

@media (max-width: 420px) {
    .app {
        padding: 20px 15px;
    }

    h1 {
        font-size: 23px;
    }

    .add-box {
        flex-wrap: wrap;
    }

    #taskInput {
        width: 100%;
        flex-basis: 60%;
    }

    .task {
        flex-wrap: wrap;
    }
}
</style>
</head>

<body>

<div class="app">
    <h1>আমার টু-ডু লিস্ট</h1>

    <form class="add-box" id="taskForm">
        <input
            type="text"
            id="taskInput"
            placeholder="নতুন কাজ এখানে লিখুন..."
            autocomplete="off"
            required
        >
        <button class="add-btn" id="submitBtn" type="submit">
            যোগ করুন
        </button>
    </form>

    <div class="tools">
        <input
            type="search"
            id="searchInput"
            placeholder="কাজ খুঁজুন..."
        >

        <select id="filterSelect" aria-label="কাজ ফিল্টার">
            <option value="all">সব কাজ</option>
            <option value="active">অসম্পূর্ণ কাজ</option>
            <option value="completed">সম্পন্ন কাজ</option>
        </select>
    </div>

    <div class="stats">
        <span>মোট: <strong id="totalCount">0</strong></span>
        <span>বাকি: <strong id="activeCount">0</strong></span>
        <span>শেষ: <strong id="completedCount">0</strong></span>
        <span><strong id="percentage">0%</strong></span>
    </div>

    <div class="progress-bg">
        <div id="progressBar"></div>
    </div>

    <ul id="taskList"></ul>

    <div class="bottom">
        <button class="clear-btn" id="clearCompleted">
            শেষ হওয়া কাজ মুছুন
        </button>

        <button class="theme-btn" id="themeBtn">
            🌙 Dark Mode
        </button>
    </div>
</div>

<script>
const taskForm = document.getElementById("taskForm");
const taskInput = document.getElementById("taskInput");
const submitBtn = document.getElementById("submitBtn");
const taskList = document.getElementById("taskList");
const searchInput = document.getElementById("searchInput");
const filterSelect = document.getElementById("filterSelect");

let tasks = [];
let editingId = null;

try {
    tasks = JSON.parse(localStorage.getItem("myTodoTasks")) || [];
    if (!Array.isArray(tasks)) tasks = [];
} catch {
    tasks = [];
}

function saveTasks() {
    try {
        localStorage.setItem("myTodoTasks", JSON.stringify(tasks));
    } catch {
        alert("কাজ Save করা যায়নি। Browser Storage পরীক্ষা করুন।");
    }
}

function renderTasks() {
    taskList.replaceChildren();

    const query = searchInput.value.trim().toLowerCase();
    const filter = filterSelect.value;

    const filteredTasks = tasks.filter(task => {
        const matchesSearch = task.text.toLowerCase().includes(query);

        const matchesFilter =
            filter === "all" ||
            (filter === "active" && !task.completed) ||
            (filter === "completed" && task.completed);

        return matchesSearch && matchesFilter;
    });

    if (filteredTasks.length === 0) {
        const empty = document.createElement("li");
        empty.className = "empty";
        empty.textContent = tasks.length === 0
            ? "এখনো কোনো কাজ যোগ করা হয়নি।"
            : "কোনো কাজ পাওয়া যায়নি।";
        taskList.appendChild(empty);
    }

    filteredTasks.forEach(task => {
        const li = document.createElement("li");
        li.className = "task" + (task.completed ? " done" : "");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.completed;
        checkbox.setAttribute("aria-label", "কাজ সম্পন্ন করুন");

        checkbox.addEventListener("change", () => {
            task.completed = checkbox.checked;
            saveTasks();
            renderTasks();
        });

        const text = document.createElement("span");
        text.className = "task-text";
        text.textContent = task.text;

        const actions = document.createElement("div");
        actions.className = "actions";

        const editBtn = document.createElement("button");
        editBtn.className = "edit-btn";
        editBtn.textContent = "Edit";

        editBtn.addEventListener("click", () => {
            taskInput.value = task.text;
            editingId = task.id;
            submitBtn.textContent = "আপডেট";
            taskInput.focus();
        });

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "delete-btn";
        deleteBtn.textContent = "মুছে ফেলুন";

        deleteBtn.addEventListener("click", () => {
            tasks = tasks.filter(item => item.id !== task.id);

            if (editingId === task.id) {
                editingId = null;
                taskInput.value = "";
                submitBtn.textContent = "যোগ করুন";
            }

            saveTasks();
            renderTasks();
        });

        actions.append(editBtn, deleteBtn);
        li.append(checkbox, text, actions);
        taskList.appendChild(li);
    });

    updateStats();
}

function updateStats() {
    const total = tasks.length;
    const completed = tasks.filter(task => task.completed).length;
    const active = total - completed;
    const percent = total === 0
        ? 0
        : Math.round((completed / total) * 100);

    document.getElementById("totalCount").textContent = total;
    document.getElementById("activeCount").textContent = active;
    document.getElementById("completedCount").textContent = completed;
    document.getElementById("percentage").textContent = percent + "%";
    document.getElementById("progressBar").style.width = percent + "%";
}

taskForm.addEventListener("submit", event => {
    event.preventDefault();

    const text = taskInput.value.trim();
    if (!text) return;

    if (editingId !== null) {
        const task = tasks.find(item => item.id === editingId);

        if (task) task.text = text;
        editingId = null;
        submitBtn.textContent = "যোগ করুন";
    } else {
        tasks.push({
            id: Date.now().toString() + Math.random().toString(16).slice(2),
            text: text,
            completed: false
        });
    }

    saveTasks();
    taskInput.value = "";
    renderTasks();
    taskInput.focus();
});

searchInput.addEventListener("input", renderTasks);
filterSelect.addEventListener("change", renderTasks);

document.getElementById("clearCompleted").addEventListener("click", () => {
    tasks = tasks.filter(task => !task.completed);

    editingId = null;
    taskInput.value = "";
    submitBtn.textContent = "যোগ করুন";

    saveTasks();
    renderTasks();
});

document.getElementById("themeBtn").addEventListener("click", () => {
    document.body.classList.toggle("dark");

    const isDark = document.body.classList.contains("dark");
    document.getElementById("themeBtn").textContent =
        isDark ? "☀️ Light Mode" : "🌙 Dark Mode";

    localStorage.setItem("myTodoTheme", isDark ? "dark" : "light");
});

if (localStorage.getItem("myTodoTheme") === "dark") {
    document.body.classList.add("dark");
    document.getElementById("themeBtn").textContent = "☀️ Light Mode";
}

renderTasks();
</script>

</body>
</html>
